services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: vellum
      POSTGRES_USER: vellum_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellum_app -d vellum"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
